<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10110f" />
    <title>Skills | Infinity Gauntlet</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="skills.css" rel="stylesheet" />
    <script src="skills.js" defer></script>
  </head>
  <body class="skills-demo">
    <main>
      <section class="skills-showcase py-5" id="skills" aria-labelledby="skills-title">
        <video
          class="skills-background-video"
          muted
          loop
          playsinline
          preload="metadata"
          aria-hidden="true"
          tabindex="-1"
        >
          <source src="assets/background.mp4" type="video/mp4" />
        </video>
        <div class="skills-video-shade" aria-hidden="true"></div>
        <div class="container">
          <header class="skills-heading text-center">
            <p class="skills-eyebrow">THE DEVELOPER TOOLKIT</p>
            <h1 id="skills-title">Skills forged through practice</h1>
          </header>

          <div class="skills-stage gauntlet-stage" aria-label="Interactive skills showcase">
            <svg class="connection-lines" viewBox="0 0 1000 660" aria-hidden="true">
              <path d="M500 330 C390 255 255 180 115 135" />
              <path d="M500 330 C500 225 500 145 500 72" />
              <path d="M500 330 C610 255 745 180 885 135" />
              <path d="M500 330 C650 330 780 330 920 330" />
              <path d="M500 330 C630 400 760 490 870 545" />
              <path d="M500 330 C500 425 500 505 500 585" />
              <path d="M500 330 C370 400 240 490 130 545" />
            </svg>

            <div class="energy-arcs" aria-hidden="true"><i></i><i></i><i></i></div>
            <div class="energy-sparks" aria-hidden="true">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>

            <button
              class="gauntlet-button"
              type="button"
              aria-label="Close the Infinity Gauntlet and reveal skills"
              aria-expanded="false"
              aria-controls="skill-list"
            >
              <span class="gauntlet-aura" aria-hidden="true"></span>
              <span class="gauntlet-art" aria-hidden="true">
                <span class="gauntlet-finger finger-index">
                  <i class="finger-tip"></i><i class="finger-joint"></i><i class="finger-base"></i>
                </span>
                <span class="gauntlet-finger finger-middle">
                  <i class="finger-tip"></i><i class="finger-joint"></i><i class="finger-base"></i>
                </span>
                <span class="gauntlet-finger finger-ring">
                  <i class="finger-tip"></i><i class="finger-joint"></i><i class="finger-base"></i>
                </span>
                <span class="gauntlet-finger finger-pinky">
                  <i class="finger-tip"></i><i class="finger-joint"></i><i class="finger-base"></i>
                </span>
                <span class="gauntlet-thumb"><i></i><b></b></span>
                <img class="gauntlet-palm" src="assets/images/gauntlet-palm.svg" alt="" />
                <span class="infinity-stones" aria-hidden="true">
                  <i class="stone stone-space"></i><i class="stone stone-mind"></i>
                  <i class="stone stone-reality"></i><i class="stone stone-power"></i>
                  <i class="stone stone-time"></i><i class="stone stone-soul"></i>
                </span>
                <span class="gauntlet-wrist" aria-hidden="true"></span>
              </span>
              <span class="visually-hidden">Toggle the gauntlet and skill reveal</span>
            </button>

            <div class="skill-items" id="skill-list" aria-label="Technology skills">
              <article class="skill-node skill-javascript">
                <img src="assets/icons/javascript.svg" alt="JavaScript logo" />
                <h2>JavaScript</h2>
              </article>
              <article class="skill-node skill-html">
                <img src="assets/icons/html.svg" alt="HTML5 logo" />
                <h2>HTML5</h2>
              </article>
              <article class="skill-node skill-css">
                <img src="assets/icons/css.svg" alt="CSS3 logo" />
                <h2>CSS3</h2>
              </article>
              <article class="skill-node skill-react">
                <img src="assets/icons/react.svg" alt="React logo" />
                <h2>React</h2>
              </article>
              <article class="skill-node skill-python">
                <img src="assets/icons/python.svg" alt="Python logo" />
                <h2>Python</h2>
              </article>
              <article class="skill-node skill-django">
                <img src="assets/icons/django.svg" alt="Django logo" />
                <h2>Django</h2>
              </article>
              <article class="skill-node skill-mysql">
                <img src="assets/icons/mysql.svg" alt="MySQL logo" />
                <h2>MySQL</h2>
              </article>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
